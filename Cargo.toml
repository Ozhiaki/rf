[package]
name = "rf"
version = "0.0.1"
edition = "2021"
description = "rf — an agent-friendly search envelope that fuses ripgrep and fd, with cross-tool stage attribution for false-negative forensics. Early development; see the repository for status."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ozhiaki/rf"
keywords = ["ripgrep", "fd", "search", "cli", "grep"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "rf"
path = "src/main.rs"

[dependencies]
# ripgrep's and fd's own guts, linked in-process. This is the whole point of the
# port: match provenance and file classification are read natively, not
# reconstructed from a shell pipe's stdout.
ignore = "0.4"            # fd/ripgrep's walker + .gitignore/.ignore semantics
grep-regex = "0.1"        # ripgrep's regex matcher
grep-searcher = "0.1"     # ripgrep's searcher (binary detection, encodings)

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
