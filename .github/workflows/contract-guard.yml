name: Contract guard

# Enforces that the crate documentation prose still agrees with the committed
# release-candidate contract fixture, and that the fixture is not stale before a
# package is cut. The guard tool is `plumbline` (invoked as `plumb`), an
# installed CLI, not an in-repo member; it reads `plumbline.json`. Runs per tree,
# so this crate tree can go green independently of the site tree.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the guard tool (plumbline)
        run: cargo install --git https://github.com/rgfind/plumbline.git plumbline --locked
      - name: Registered claims match the committed fixture
        run: plumb check
      - name: Committed fixture is not stale (re-capture from the built binary)
        run: plumb capture --check
